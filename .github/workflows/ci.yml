name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no outside packages
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
  example:
    # The example backends' tests, against a real naira-sim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: go build -o nairasim ./cmd/nairasim
      - run: ./nairasim & sleep 1
      - run: node --test
        working-directory: examples/node-backend
      - run: node --test
        working-directory: examples/paystack-backend
  service:
    # The README's CI recipe, exactly as a team would use it: the published
    # image as a service container, and a Paystack backend's tests against it.
    runs-on: ubuntu-latest
    services:
      naira-sim:
        image: ghcr.io/temitayo-spec/naira-sim:latest
        ports: ["7070:7070"]
        options: --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test
        working-directory: examples/paystack-backend
        env:
          SIM_URL: http://localhost:7070
          WEBHOOK_HOST: host.docker.internal
  image:
    # Publishes ghcr.io/temitayo-spec/naira-sim once the tests pass: from main
    # as latest and the commit's short SHA, from a v* tag as its version
    # (0.1.0 and 0.1). amd64 and arm64.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [go, example]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/temitayo-spec/naira-sim
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
